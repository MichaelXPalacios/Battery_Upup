apiVersion: 1

providers:
  - name: dispatch
    orgId: 1
    folder: Dispatch
    type: file
    disableDeletion: true       # the dashboard lives in git (ops/grafana/dashboards/dispatch.json), not in Grafana's database
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards     # docker-compose mounts ops/grafana/dashboards here
