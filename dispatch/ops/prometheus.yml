# Prometheus for the dispatch service. In docker-compose the service is reachable as dispatch:8000.
# Running uvicorn on the host instead? Replace the target with host.docker.internal:8000 (Docker Desktop) or localhost:8000
# (a Prometheus on the host). /metrics is open on purpose (probes and scrapers carry no token); /signal, /kill and /resume
# are the ones DISPATCH_API_TOKEN protects.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# No Alertmanager is configured. To page someone, add one here:
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: dispatch
    metrics_path: /metrics
    scrape_timeout: 10s
    static_configs:
      - targets: ["dispatch:8000"]
        labels:
          service: dispatch
